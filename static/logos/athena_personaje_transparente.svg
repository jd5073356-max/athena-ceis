<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="108 60 144 240" role="img">
<title>Isotipo animado del proyecto Athena</title>
<desc>Símbolo de Athena: yelmo corintio con animación de boca y ojos sobre columna clásica.</desc>

<defs>
  <style>
    .ath-mouth {
      transform-origin: 0px 1px;
      animation: athMouthIdle 4.5s infinite ease-in-out;
    }
    .ath-pupil-l {
      transform-origin: -15px -26px;
      animation: athBlink 3.6s infinite ease-in-out;
    }
    .ath-pupil-r {
      transform-origin: 15px -26px;
      animation: athBlink 3.6s infinite ease-in-out;
    }
    .ath-body {
      transform-origin: 0px 0px;
      animation: athFloat 3.8s infinite ease-in-out;
    }

    @keyframes athBlink {
      0%, 92%, 100% { transform: scaleY(1); }
      95%, 97% { transform: scaleY(0.12); }
    }
    @keyframes athMouthIdle {
      0%, 75%, 100% { transform: scaleY(0.18) scaleX(0.85); }
      79% { transform: scaleY(0.8) scaleX(0.95); }
      83% { transform: scaleY(0.3) scaleX(0.9); }
      88% { transform: scaleY(1.05) scaleX(1.02); }
      93% { transform: scaleY(0.22) scaleX(0.88); }
    }
    @keyframes athMouthTalk {
      0%, 100% { transform: scaleY(0.2) scaleX(0.88); }
      25% { transform: scaleY(1.15) scaleX(0.98); }
      50% { transform: scaleY(0.38) scaleX(0.92); }
      75% { transform: scaleY(1.28) scaleX(1.05); }
    }
    @keyframes athFloat {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-3px); }
    }
  </style>
</defs>

<g class="ath-body" transform="translate(180,210) scale(1.6)">
  <!-- Cresta del yelmo -->
  <path d="M -42 -52 Q 0 -92 42 -52 L 30 -44 Q 0 -72 -30 -44 Z" fill="#e8c44d" />
  <path d="M -30 -44 Q 0 -72 30 -44 L 30 -38 Q 0 -64 -30 -38 Z" fill="#d4af37" />
  <!-- Bóveda del yelmo -->
  <path d="M -38 -8 Q -38 -50 0 -50 Q 38 -50 38 -8 Z" fill="#5b8bc4" />
  <!-- Visera y protector de barbilla -->
  <rect x="-38" y="-10" width="76" height="13" rx="3" fill="#dfe8f2" />
  <path d="M -14 3 Q 0 7.5 14 3 Z" fill="#dfe8f2" />
  <!-- Cuencas oculares búho -->
  <circle cx="-15" cy="-26" r="8" fill="#16243a" />
  <circle cx="15" cy="-26" r="8" fill="#16243a" />
  <!-- Pupilas animadas con parpadeo -->
  <circle class="ath-pupil-l" cx="-15" cy="-26" r="3.5" fill="#dfe8f2" />
  <circle class="ath-pupil-r" cx="15" cy="-26" r="3.5" fill="#dfe8f2" />
  <!-- Protector nasal -->
  <rect x="-2.5" y="-20" width="5" height="19" rx="2" fill="#dfe8f2" />
  <!-- Boca animada (abre y cierra) -->
  <g class="ath-mouth">
    <path d="M -6 0.8 Q 0 -1 6 0.8 Q 6 5.5 0 5.5 Q -6 5.5 -6 0.8 Z" fill="#16243a" />
    <path d="M -3.5 3.6 Q 0 5.5 3.5 3.6 Z" fill="#f43f5e" />
    <path d="M -3.5 1 Q 0 1.8 3.5 1" stroke="#ffffff" stroke-width="0.8" fill="none" stroke-linecap="round" />
  </g>
  <!-- Capitel de la columna -->
  <rect x="-30" y="6" width="60" height="8" rx="2" fill="#7ba3d6" />
  <!-- Fuste de la columna -->
  <rect x="-24" y="16" width="48" height="30" fill="#5b8bc4" />
  <line x1="-14" y1="16" x2="-14" y2="46" stroke="#3b6ea5" stroke-width="2" />
  <line x1="0" y1="16" x2="0" y2="46" stroke="#3b6ea5" stroke-width="2" />
  <line x1="14" y1="16" x2="14" y2="46" stroke="#3b6ea5" stroke-width="2" />
  <!-- Base de la columna -->
  <rect x="-30" y="46" width="60" height="8" rx="2" fill="#7ba3d6" />
</g>
</svg>