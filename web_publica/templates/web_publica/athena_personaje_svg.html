<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="108 60 144 240" role="img">
<title>Isotipo animado del proyecto Athena</title>
<desc>Símbolo de Athena: yelmo corintio con animación de boca y ojos sobre columna clásica.</desc>

<g transform="translate(180,210) scale(1.6)">
  <!-- Cresta del yelmo -->
  <path d="M -42 -52 Q 0 -92 42 -52 L 30 -44 Q 0 -72 -30 -44 Z" fill="#e8c44d" />
  <path d="M -30 -44 Q 0 -72 30 -44 L 30 -38 Q 0 -64 -30 -38 Z" fill="#d4af37" />
  <!-- Bóveda del yelmo -->
  <path d="M -38 -8 Q -38 -50 0 -50 Q 38 -50 38 -8 Z" fill="#5b8bc4" />
  <!-- Visera y protector de barbilla -->
  <rect x="-38" y="-10" width="76" height="13" rx="3" fill="#dfe8f2" />
  <path d="M -14 3 Q 0 7.5 14 3 Z" fill="#dfe8f2" />
  <!-- Cuencas oculares fijas búho -->
  <circle cx="-15" cy="-26" r="8" fill="#16243a" />
  <circle cx="15" cy="-26" r="8" fill="#16243a" />
  <!-- Pupilas animadas con parpadeo suave -->
  <ellipse cx="-15" cy="-26" rx="3.5" ry="3.5" fill="#dfe8f2">
    <animate attributeName="ry" dur="3.6s" repeatCount="indefinite" values="3.5; 3.5; 0.3; 3.5; 3.5" keyTimes="0; 0.92; 0.95; 0.98; 1" />
  </ellipse>
  <ellipse cx="15" cy="-26" rx="3.5" ry="3.5" fill="#dfe8f2">
    <animate attributeName="ry" dur="3.6s" repeatCount="indefinite" values="3.5; 3.5; 0.3; 3.5; 3.5" keyTimes="0; 0.92; 0.95; 0.98; 1" />
  </ellipse>
  <!-- Protector nasal -->
  <rect x="-2.5" y="-20" width="5" height="19" rx="2" fill="#dfe8f2" />
  <!-- Boca viva animada (abre, modula y cierra) -->
  <g id="ath-mouth">
    <path fill="#16243a">
      <animate attributeName="d" dur="1.1s" repeatCount="indefinite"
        values="
          M -6 1.2 Q 0 1.8 6 1.2 Q 6 2.2 0 2.2 Q -6 2.2 -6 1.2 Z;
          M -6 0.2 Q 0 -1.5 6 0.2 Q 6 4.8 0 4.8 Q -6 4.8 -6 0.2 Z;
          M -5 0.8 Q 0 0.2 5 0.8 Q 5 2.8 0 2.8 Q -5 2.8 -5 0.8 Z;
          M -6 0 Q 0 -2 6 0 Q 6 6 0 6 Q -6 6 -6 0 Z;
          M -6 1.2 Q 0 1.8 6 1.2 Q 6 2.2 0 2.2 Q -6 2.2 -6 1.2 Z
        "
        keyTimes="0; 0.25; 0.5; 0.75; 1"
      />
    </path>
    <!-- Lengua rosada visible cuando abre la boca -->
    <path fill="#f43f5e">
      <animate attributeName="d" dur="1.1s" repeatCount="indefinite"
        values="
          M -3 1.9 Q 0 2.1 3 1.9 Z;
          M -3.5 3.6 Q 0 5 3.5 3.6 Z;
          M -3 2.2 Q 0 3 3 2.2 Z;
          M -3.5 4.5 Q 0 6.2 3.5 4.5 Z;
          M -3 1.9 Q 0 2.1 3 1.9 Z
        "
        keyTimes="0; 0.25; 0.5; 0.75; 1"
      />
    </path>
    <!-- Diente superior blanco -->
    <path stroke="#ffffff" stroke-width="0.8" fill="none" stroke-linecap="round">
      <animate attributeName="d" dur="1.1s" repeatCount="indefinite"
        values="
          M -2 1.4 L 2 1.4;
          M -3.5 0.8 Q 0 1.6 3.5 0.8;
          M -3 1 L 3 1;
          M -3.5 0.7 Q 0 1.6 3.5 0.7;
          M -2 1.4 L 2 1.4
        "
        keyTimes="0; 0.25; 0.5; 0.75; 1"
      />
    </path>
  </g>
  <!-- Capitel de la columna -->
  <rect x="-30" y="6" width="60" height="8" rx="2" fill="#7ba3d6" />
  <!-- Fuste de la columna -->
  <rect x="-24" y="16" width="48" height="30" fill="#5b8bc4" />
  <line x1="-14" y1="16" x2="-14" y2="46" stroke="#3b6ea5" stroke-width="2" />
  <line x1="0" y1="16" x2="0" y2="46" stroke="#3b6ea5" stroke-width="2" />
  <line x1="14" y1="16" x2="14" y2="46" stroke="#3b6ea5" stroke-width="2" />
  <!-- Base de la columna -->
  <rect x="-30" y="46" width="60" height="8" rx="2" fill="#7ba3d6" />
</g>
</svg>
